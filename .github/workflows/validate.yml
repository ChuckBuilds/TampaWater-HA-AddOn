name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pii:
    name: No personal data
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed at
      # new code, which would run arbitrary steps with this workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_no_pii.py

  addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: "./tampa_water"

  tests:
    name: Parser + auth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r tampa_water/app/requirements.txt 'httpx<1' ruff
      - name: Bill parser reconciliation
        run: python tests/test_parsers.py
      - name: Meter-comparison window arithmetic
        run: python tests/test_window.py
      - name: API must not be reachable without a token
        run: python tests/test_auth.py
      - name: Byte-compile
        run: python -m compileall -q tampa_water/app scripts tests
      - name: Ruff (non-blocking)
        run: ruff check tampa_water/app || true
